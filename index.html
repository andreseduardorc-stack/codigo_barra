<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Lector de Códigos & Inventario</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --card-border: #334155;
      --accent: #38bdf8;
      --accent-btn: #0284c7;
      --success: #10b981;
      --danger: #ef4444;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: var(--bg); color: var(--text-main); display: flex; flex-direction: column; height: 100vh; overflow: hidden; }

    /* Cabecera */
    header {
      padding: 12px 16px;
      background-color: var(--card-bg);
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--card-border);
    }
    header h1 { font-size: 1.05rem; font-weight: 700; color: var(--accent); }
    #item-counter { font-size: 0.82rem; color: var(--text-muted); background: #0f172a; padding: 3px 10px; border-radius: 12px; }

    /* Contenedor de Cámara */
    .scanner-container { position: relative; width: 100%; height: 36vh; min-height: 220px; background: #000; overflow: hidden; }
    video { width: 100%; height: 100%; object-fit: cover; }

    /* Mira de enfoque */
    .target-box {
      position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
      width: 75%; height: 55%; border: 2px dashed rgba(56, 189, 248, 0.6); border-radius: 10px;
      box-shadow: 0 0 0 9999px rgba(0, 0, 0, 0.5); pointer-events: none;
      transition: all 0.2s ease;
    }
    .target-box.focused {
      border: 2px solid var(--success);
      box-shadow: 0 0 0 9999px rgba(16, 185, 129, 0.2);
    }

    /* Etiqueta flotante de código enfocado */
    .focus-badge {
      position: absolute; bottom: 12px; left: 50%; transform: translateX(-50%);
      background: rgba(15, 23, 42, 0.9); border: 1px solid var(--success);
      color: var(--success); font-family: monospace; font-size: 0.85rem; font-weight: 700;
      padding: 5px 12px; border-radius: 20px; display: none; z-index: 10;
      box-shadow: 0 4px 10px rgba(0,0,0,0.5);
    }

    /* Botón Linterna */
    .torch-btn {
      position: absolute; top: 12px; right: 12px;
      width: 40px; height: 40px; border-radius: 50%; border: none;
      background: rgba(15, 23, 42, 0.85); color: #fff; font-size: 1.1rem;
      cursor: pointer; z-index: 10; display: none; align-items: center; justify-content: center;
      box-shadow: 0 2px 6px rgba(0,0,0,0.4);
    }
    .torch-btn.active { background: #f59e0b; color: #000; }

    /* Barra de Acción Principal: Capturar y Escribir */
    .action-panel {
      padding: 10px 14px;
      background: var(--card-bg);
      border-bottom: 1px solid var(--card-border);
      display: flex;
      gap: 10px;
    }
    .btn-capture {
      flex: 1.8;
      background: var(--accent-btn);
      color: #fff;
      font-weight: 700;
      font-size: 0.95rem;
      padding: 12px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: 0 2px 8px rgba(2, 132, 199, 0.4);
    }
    .btn-capture:active { transform: scale(0.98); }
    .btn-capture.scanning { background: #0369a1; }

    .btn-manual {
      flex: 1;
      background: #334155;
      color: #f1f5f9;
      font-weight: 600;
      font-size: 0.85rem;
      padding: 12px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    .btn-manual:active { transform: scale(0.98); }

    /* Barra de Exportación */
    .export-bar {
      padding: 8px 14px;
      background: #0b1120;
      display: flex;
      gap: 8px;
      border-bottom: 1px solid var(--card-border);
    }
    .btn-export {
      flex: 1;
      padding: 8px;
      border: none;
      border-radius: 6px;
      font-size: 0.78rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
    }
    .btn-csv { background: var(--success); color: #fff; }
    .btn-share { background: #0284c7; color: #fff; }
    .btn-clear { background: var(--danger); color: #fff; flex: 0.4; }

    /* Listado limpio de códigos */
    .list-container {
      flex: 1;
      overflow-y: auto;
      padding: 10px 14px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .item-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 8px;
      padding: 10px 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }
    .item-main { flex: 1; min-width: 0; }
    .item-code {
      font-family: monospace;
      font-size: 1.05rem;
      font-weight: 700;
      color: #38bdf8;
      word-break: break-all;
    }
    .item-comment {
      font-size: 0.82rem;
      color: #cbd5e1;
      margin-top: 3px;
      background: #0f172a;
      padding: 3px 8px;
      border-radius: 4px;
      display: inline-block;
      max-width: 100%;
      word-break: break-word;
    }
    .item-time {
      font-size: 0.7rem;
      color: var(--text-muted);
      margin-top: 4px;
    }
    .btn-delete {
      background: transparent;
      border: none;
      color: #64748b;
      font-size: 1.1rem;
      cursor: pointer;
      padding: 6px 10px;
      border-radius: 6px;
    }
    .btn-delete:hover, .btn-delete:active { color: var(--danger); background: rgba(239, 68, 68, 0.15); }

    .empty-msg {
      text-align: center;
      color: var(--text-muted);
      margin-top: 40px;
      font-size: 0.85rem;
    }

    /* Modal para Confirmar Código y Agregar Comentario */
    .modal-overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,0.75); backdrop-filter: blur(3px);
      display: none; align-items: flex-end; justify-content: center; z-index: 100;
    }
    .modal-overlay.open { display: flex; }
    .modal-sheet {
      background: var(--card-bg);
      border-top: 1px solid var(--card-border);
      border-radius: 16px 16px 0 0;
      width: 100%;
      max-width: 500px;
      padding: 18px 16px 24px 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      animation: slideUp 0.2s ease;
    }
    @keyframes slideUp {
      from { transform: translateY(100%); }
      to { transform: translateY(0); }
    }
    .modal-title { font-size: 1rem; font-weight: 700; color: var(--accent); }
    .field-label { font-size: 0.75rem; color: var(--text-muted); font-weight: 600; text-transform: uppercase; }
    .modal-input {
      width: 100%;
      background: #0f172a;
      border: 1px solid var(--card-border);
      border-radius: 8px;
      padding: 10px 12px;
      color: var(--text-main);
      font-size: 0.95rem;
      outline: none;
    }
    .modal-input:focus { border-color: var(--accent); }
    .modal-input.code-style { font-family: monospace; font-weight: 700; color: #38bdf8; font-size: 1.1rem; }

    .modal-actions {
      display: flex;
      gap: 10px;
      margin-top: 6px;
    }
    .btn-save-confirm {
      flex: 1.6;
      background: var(--success);
      color: #fff;
      font-weight: 700;
      font-size: 0.95rem;
      padding: 12px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }
    .btn-cancel-modal {
      flex: 1;
      background: #334155;
      color: var(--text-muted);
      font-weight: 600;
      font-size: 0.9rem;
      padding: 12px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }
  </style>
  <script src="https://unpkg.com/@zxing/library@latest"></script>
</head>
<body>

  <header>
    <h1>Escáner & Inventario</h1>
    <span id="item-counter">0 códigos</span>
  </header>

  <!-- Visor de Cámara -->
  <div class="scanner-container">
    <video id="preview" playsinline autoplay muted></video>
    <div class="target-box" id="target-box"></div>
    <div class="focus-badge" id="focus-badge">Código detectado</div>
    <button class="torch-btn" id="torch-btn" onclick="toggleTorch()" title="Linterna">🔦</button>
  </div>

  <!-- Botones de Acción (El usuario decide cuándo escanear o escribir) -->
  <div class="action-panel">
    <button class="btn-capture" id="btn-capture" onclick="handleCaptureClick()">
      📸 Escanear Ahora
    </button>
    <button class="btn-manual" onclick="openModalForManual()">
      ⌨️ Escribir
    </button>
  </div>

  <!-- Barra de Exportación -->
  <div class="export-bar">
    <button class="btn-export btn-csv" onclick="exportData('csv')">📄 Descargar CSV</button>
    <button class="btn-export btn-share" onclick="shareData()">📲 Compartir</button>
    <button class="btn-export btn-clear" onclick="clearAll()">🗑️</button>
  </div>

  <!-- Lista Limpia de Códigos Guardados -->
  <div class="list-container" id="records-list"></div>

  <!-- Ventana de Confirmación y Comentario -->
  <div class="modal-overlay" id="save-modal">
    <div class="modal-sheet">
      <div class="modal-title">Guardar Registro</div>
      
      <div>
        <label class="field-label">Código</label>
        <input type="text" id="modal-code" class="modal-input code-style" placeholder="Ej: 78012345678" />
      </div>

      <div>
        <label class="field-label">Comentario u Observación (Opcional)</label>
        <input type="text" id="modal-comment" class="modal-input" placeholder="Ej: Caja dañada, Estante 3, Lote A..." />
      </div>

      <div class="modal-actions">
        <button class="btn-save-confirm" onclick="saveRecordFromModal()">💾 Guardar</button>
        <button class="btn-cancel-modal" onclick="closeModal()">✕ Cancelar</button>
      </div>
    </div>
  </div>

  <script>
    const STORAGE_KEY = 'bodega_clean_records_v1';
    let records = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');

    // Detección en memoria (solo para enfocar, NUNCA guarda automáticamente)
    let latestSeenCode = '';
    let latestSeenTime = 0;
    
    let barcodeDetector = null;
    let zxingReader = null;
    let currentStream = null;
    let isTorchOn = false;

    const video = document.getElementById('preview');
    const targetBox = document.getElementById('target-box');
    const focusBadge = document.getElementById('focus-badge');

    document.addEventListener('DOMContentLoaded', () => {
      renderList();
      initScanner();
    });

    // 1. Inicializar Cámara y Motores
    async function initScanner() {
      try {
        currentStream = await navigator.mediaDevices.getUserMedia({
          video: {
            facingMode: { ideal: "environment" },
            width: { ideal: 1280 },
            height: { ideal: 720 },
            focusMode: "continuous"
          },
          audio: false
        });
        video.srcObject = currentStream;
        await video.play();

        // Linterna
        const track = currentStream.getVideoTracks()[0];
        if (track && track.getCapabilities && track.getCapabilities().torch) {
          document.getElementById('torch-btn').style.display = 'flex';
        }

        // Configurar detección pasiva en visor
        if ('BarcodeDetector' in window) {
          const supported = await BarcodeDetector.getSupportedFormats();
          barcodeDetector = new BarcodeDetector({ formats: supported });
          startNativePassiveLoop();
        } else {
          startZXingPassiveLoop();
        }
      } catch (err) {
        console.error('Error al iniciar cámara:', err);
      }
    }

    // Loop pasivo nativo: sólo registra qué código está frente a la cámara
    function startNativePassiveLoop() {
      const loop = async () => {
        if (video.readyState === video.HAVE_ENOUGH_DATA && barcodeDetector) {
          try {
            const codes = await barcodeDetector.detect(video);
            if (codes && codes.length > 0) {
              registerPassiveSighting(codes[0].rawValue);
            }
          } catch (e) {}
        }
        requestAnimationFrame(loop);
      };
      requestAnimationFrame(loop);
    }

    // Loop pasivo ZXing: fallback universal
    function startZXingPassiveLoop() {
      zxingReader = new ZXing.BrowserMultiFormatReader();
      zxingReader.decodeFromVideoElement(video, (result) => {
        if (result) {
          registerPassiveSighting(result.getText());
        }
      });
    }

    // Señal visual de que la cámara ve un código (sin guardarlo)
    function registerPassiveSighting(val) {
      if (!val) return;
      latestSeenCode = String(val).trim();
      latestSeenTime = Date.now();

      targetBox.classList.add('focused');
      focusBadge.innerText = `Enfocado: ${latestSeenCode}`;
      focusBadge.style.display = 'block';
    }

    // Ocultar indicador si el código se retira de la cámara
    setInterval(() => {
      if (Date.now() - latestSeenTime > 1200) {
        targetBox.classList.remove('focused');
        focusBadge.style.display = 'none';
      }
    }, 400);

    // 2. Botón de Escanear: El usuario decide cuándo capturar
    function handleCaptureClick() {
      const btn = document.getElementById('btn-capture');

      // Si ya hay un código en foco en este instante:
      if (latestSeenCode && (Date.now() - latestSeenTime < 1500)) {
        openModalWithCode(latestSeenCode);
        return;
      }

      // Si aún no está enfocado, busca activamente durante 2 segundos
      btn.classList.add('scanning');
      btn.innerText = 'Buscando en la mira...';

      const startTime = Date.now();
      const checkInterval = setInterval(() => {
        if (latestSeenCode && (Date.now() - latestSeenTime < 1000)) {
          clearInterval(checkInterval);
          btn.classList.remove('scanning');
          btn.innerHTML = '📸 Escanear Ahora';
          openModalWithCode(latestSeenCode);
          return;
        }

        if (Date.now() - startTime > 2200) {
          clearInterval(checkInterval);
          btn.classList.remove('scanning');
          btn.innerHTML = '📸 Escanear Ahora';
          alert('No se detectó ningún código. Enfócalo dentro del recuadro e inténtalo de nuevo.');
        }
      }, 150);
    }

    // 3. Abrir ventana de guardado
    function openModalWithCode(code) {
      if (navigator.vibrate) navigator.vibrate(80);
      document.getElementById('modal-code').value = code || '';
      document.getElementById('modal-comment').value = '';
      document.getElementById('save-modal').classList.add('open');

      // Colocar cursor en el comentario para que el usuario escriba rápido
      setTimeout(() => {
        document.getElementById('modal-comment').focus();
      }, 150);
    }

    function openModalForManual() {
      document.getElementById('modal-code').value = '';
      document.getElementById('modal-comment').value = '';
      document.getElementById('save-modal').classList.add('open');

      setTimeout(() => {
        document.getElementById('modal-code').focus();
      }, 150);
    }

    function closeModal() {
      document.getElementById('save-modal').classList.remove('open');
    }

    // 4. Guardar en la lista (Solo se ejecuta al presionar "Guardar")
    function saveRecordFromModal() {
      const codeInput = document.getElementById('modal-code');
      const commentInput = document.getElementById('modal-comment');

      const code = codeInput.value.trim();
      const comment = commentInput.value.trim();

      if (!code) {
        alert('Por favor ingresa o escanea un código.');
        return;
      }

      const now = new Date();
      const timeStr = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

      // Guardar registro limpio (sin campos basura)
      records.unshift({
        code: code,
        comment: comment,
        time: timeStr,
        timestamp: now.toISOString()
      });

      localStorage.setItem(STORAGE_KEY, JSON.stringify(records));
      closeModal();
      renderList();
    }

    // 5. Renderizado Limpio de la Lista
    function renderList() {
      const container = document.getElementById('records-list');
      document.getElementById('item-counter').innerText = `${records.length} guardados`;

      if (records.length === 0) {
        container.innerHTML = `
          <div class="empty-msg">
            <p>Ningún código guardado aún.<br>Enfoca un código y presiona <b>"Escanear Ahora"</b>.</p>
          </div>
        `;
        return;
      }

      container.innerHTML = records.map((r, index) => `
        <div class="item-card">
          <div class="item-main">
            <div class="item-code">${escapeHtml(r.code)}</div>
            ${r.comment ? `<div class="item-comment">💬 ${escapeHtml(r.comment)}</div>` : ''}
            <div class="item-time">🕒 ${escapeHtml(r.time || '')}</div>
          </div>
          <button class="btn-delete" onclick="deleteItem(${index})" title="Eliminar de la lista">✕</button>
        </div>
      `).join('');
    }

    function deleteItem(index) {
      records.splice(index, 1);
      localStorage.setItem(STORAGE_KEY, JSON.stringify(records));
      renderList();
    }

    function clearAll() {
      if (records.length === 0) return;
      if (confirm('¿Vaciar toda la lista de códigos?')) {
        records = [];
        localStorage.removeItem(STORAGE_KEY);
        renderList();
      }
    }

    // 6. Linterna (Flash)
    async function toggleTorch() {
      if (!currentStream) return;
      const track = currentStream.getVideoTracks()[0];
      if (!track) return;

      try {
        isTorchOn = !isTorchOn;
        await track.applyConstraints({ advanced: [{ torch: isTorchOn }] });
        document.getElementById('torch-btn').classList.toggle('active', isTorchOn);
      } catch (e) {
        console.warn('Linterna no disponible:', e);
      }
    }

    // 7. Exportación Limpia (Solo Código, Comentario y Fecha/Hora)
    function buildCsv() {
      let csv = '\uFEFFCodigo,Comentario,Fecha_Hora\r\n';
      records.forEach(r => {
        const c = r.code.replace(/"/g, '""');
        const comm = (r.comment || '').replace(/"/g, '""');
        const date = r.timestamp ? r.timestamp.replace('T', ' ').slice(0, 19) : '';
        csv += `"${c}","${comm}","${date}"\r\n`;
      });
      return csv;
    }

    function exportData(type) {
      if (records.length === 0) {
        alert('No hay registros para exportar.');
        return;
      }

      const dateStr = new Date().toISOString().slice(0, 10);
      const csvContent = buildCsv();
      const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
      const filename = `codigos_${dateStr}.csv`;

      const url = URL.createObjectURL(blob);
      const link = document.createElement('a');
      link.href = url;
      link.download = filename;
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
      URL.revokeObjectURL(url);
    }

    // Compartir por WhatsApp, Correo, etc.
    async function shareData() {
      if (records.length === 0) {
        alert('No hay registros para compartir.');
        return;
      }

      const dateStr = new Date().toISOString().slice(0, 10);
      const filename = `codigos_${dateStr}.csv`;
      const csvContent = buildCsv();
      const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
      const file = new File([blob], filename, { type: 'text/csv' });

      if (navigator.canShare && navigator.canShare({ files: [file] })) {
        try {
          await navigator.share({
            files: [file],
            title: 'Reporte de Códigos',
            text: `Reporte con ${records.length} códigos guardados.`
          });
        } catch (err) {
          if (err.name !== 'AbortError') exportData('csv');
        }
      } else {
        exportData('csv');
      }
    }

    function escapeHtml(str) {
      return String(str || '').replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[m]);
    }
  </script>
</body>
</html>
